# Render Blueprint — deploys both services from this repo.
# Insforge remains the data backend (DB + auth + storage); these are the app's
# frontend and its Node orchestration API.
#
# Deploy: push this repo, then in Render → "New +" → "Blueprint" → pick this repo.
# Render reads this file and creates both services. Fill the `sync: false`
# secrets in the dashboard on first deploy.

services:
  # ── Node API / orchestration server (persistent — supports background jobs) ──
  - type: web
    name: cia-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: YOUCOM_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4
      - key: INSFORGE_BASE_URL
        sync: false
      - key: INSFORGE_ANON_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: AUTO_REFRESH_ENABLED
        value: "true"
      - key: SHARED_REPORT_TTL_DAYS
        value: "30"
      - key: RESEND_API_KEY
        sync: false
      - key: DIGEST_FROM_EMAIL
        value: Mira <noreply@joinmira.ai>
      - key: APP_URL
        value: https://www.joinmira.ai
      - key: ADMIN_EMAILS
        value: shanmukhsain@gmail.com

  # ── Next.js frontend ──
  - type: web
    name: cia-web
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    # Bind to the port Render assigns (not the hardcoded dev port).
    startCommand: npx next start -p $PORT
    envVars:
      # Point the browser at the API service above. Set this in the dashboard to
      # the cia-api URL once it's live (e.g. https://cia-api.onrender.com).
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      - key: NEXT_PUBLIC_INSFORGE_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_INSFORGE_ANON_KEY
        sync: false
      # Server-side copies used by Next route handlers.
      - key: INSFORGE_BASE_URL
        sync: false
      - key: INSFORGE_ANON_KEY
        sync: false
      - key: FEATURE_REQUEST_SIGNING_SECRET
        generateValue: true
